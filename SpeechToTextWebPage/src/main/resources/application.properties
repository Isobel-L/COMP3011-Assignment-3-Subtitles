spring.application.name=SpeechToTextWebPage

# Security: pull access token off the environment
# instead of hardcoding it in source!
openai.api.key=${OPENAI_API_KEY}

##################################################
# Concurrency performance control. Can test here
# with one or the other of A and B:
##################################################
# A
#spring.threads.virtual.enabled=false
#server.tomcat.threads.max=300
#server.tomcat.threads.min-spare=20
#server.tomcat.accept-count=300
# B ##############################################
spring.threads.virtual.enabled=true
##################################################

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB